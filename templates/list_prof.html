{% extends "base.html" %}

{% block content %}
    <h2 class="mb-4">Список профессий миссии</h2>
    
    {% if list_type in ['ol', 'ul'] %}
        <{{ list_type }}>
            {% for prof in professions %}
                <li>{{ prof }}</li>
            {% endfor %}
        </{{ list_type }}>
    {% else %}
        <div class="alert alert-danger">
            Неверный параметр типа списка! Используйте 'ol' или 'ul'
        </div>
    {% endif %}
{% endblock %}
